name: v0.9.3 description smoke

on:
  pull_request:
    paths:
      - "src/lib/event-description.ts"
      - "src/lib/event-game.ts"
      - "src/components/event-description.tsx"
      - "src/components/event-description-editor.tsx"
      - "src/components/create-event-form.tsx"
      - "src/components/edit-event-form.tsx"
      - "src/app/dashboard/events/[eventId]/page.tsx"
      - "src/app/dashboard/events/[eventId]/edit/page.tsx"
      - "src/app/dashboard/workspaces/[workspaceId]/page.tsx"
      - "src/app/spectate/[token]/page.tsx"
      - "src/app/api/events/[eventId]/route.ts"
      - "src/app/api/events/[eventId]/calendar/route.ts"
      - "src/app/expanded.css"
      - "tests/v093-description-smoke.cjs"
      - ".github/workflows/v093-description-smoke.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to test
        required: true
        default: feature/v0.9.3-rich-event-descriptions
        type: string

concurrency:
  group: v093-description-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  description-smoke:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Clone requested ref and run v0.9.3 release checks
        shell: powershell
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $isPullRequest = -not [string]::IsNullOrWhiteSpace($env:PR_HEAD_SHA)
          if ($isPullRequest) {
            if ([string]::IsNullOrWhiteSpace($env:PR_NUMBER)) { throw "Pull request number is missing." }
            $safeRef = "pr-$env:PR_NUMBER"
          } else {
            $targetRef = $env:REQUESTED_REF
            if ([string]::IsNullOrWhiteSpace($targetRef)) { throw "Could not determine the branch to test." }
            if ($targetRef -notmatch '^[A-Za-z0-9._/-]+$') { throw "The requested ref contains unsupported characters." }
            $safeRef = $targetRef.Replace("/", "-")
          }

          $work = Join-Path $env:RUNNER_TEMP "gamenight-v093-description-$safeRef"
          $nodeRoot = Join-Path $env:RUNNER_TEMP "node22-v093-description"
          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          if (Test-Path $nodeRoot) { Remove-Item $nodeRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $work, $nodeRoot | Out-Null

          if ($isPullRequest) {
            git clone --depth 1 "https://github.com/$env:GITHUB_REPOSITORY.git" $work
            Set-Location $work
            git fetch --depth 1 origin "refs/pull/$env:PR_NUMBER/head"
            git checkout --detach FETCH_HEAD
            $checkedOutSha = (git rev-parse HEAD).Trim()
            if ($checkedOutSha -ne $env:PR_HEAD_SHA) {
              throw "Checked out $checkedOutSha but expected PR head $env:PR_HEAD_SHA."
            }
          } else {
            git clone --depth 1 --branch "$targetRef" "https://github.com/$env:GITHUB_REPOSITORY.git" $work
            Set-Location $work
          }

          $versions = Invoke-RestMethod "https://nodejs.org/dist/index.json"
          $nodeVersion = ($versions | Where-Object { $_.version -like "v22.*" } | Select-Object -First 1).version
          if (-not $nodeVersion) { throw "Could not determine the latest Node.js 22 version." }
          $nodeZip = Join-Path $env:RUNNER_TEMP "node22-v093-description.zip"
          Invoke-WebRequest "https://nodejs.org/dist/$nodeVersion/node-$nodeVersion-win-x64.zip" -OutFile $nodeZip
          Expand-Archive $nodeZip -DestinationPath $nodeRoot -Force
          $nodeDir = Join-Path $nodeRoot "node-$nodeVersion-win-x64"
          $env:Path = "$nodeDir;$env:Path"

          npm install

          $out = Join-Path $work ".v093-description-test"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          $smokeConfigPath = Join-Path $work ".v093-description-smoke-tsconfig.json"
          $smokeConfig = @{
            compilerOptions = @{
              target = "ES2022"
              module = "commonjs"
              lib = @("ES2022", "DOM")
              outDir = ".v093-description-test"
              skipLibCheck = $true
              esModuleInterop = $true
            }
            files = @("src/lib/event-description.ts", "src/lib/event-game.ts")
          } | ConvertTo-Json -Depth 4
          $smokeConfig | Set-Content -Path $smokeConfigPath -Encoding UTF8
          npx tsc --version
          npx tsc -p "$smokeConfigPath"
          if ($LASTEXITCODE -ne 0) { throw "Could not compile v0.9.3 pure helpers for smoke tests." }

          $compiledDescription = Get-ChildItem -Path $out -Filter "event-description.js" -Recurse | Select-Object -First 1
          $compiledGame = Get-ChildItem -Path $out -Filter "event-game.js" -Recurse | Select-Object -First 1
          if (-not $compiledDescription) { throw "Compiled event-description.js was not found." }
          if (-not $compiledGame) { throw "Compiled event-game.js was not found." }
          node "tests/v093-description-smoke.cjs" "$($compiledDescription.FullName)" "$($compiledGame.FullName)"
          if ($LASTEXITCODE -ne 0) { throw "v0.9.3 smoke tests failed." }

          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw "TypeScript typecheck failed." }

          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Production build failed." }
