name: Local next-build recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Build v0.3.6 next folder recovery package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $work = Join-Path $env:RUNNER_TEMP "gamenight-tools-v0.3.6-recovery"
          $nodeRoot = Join-Path $env:RUNNER_TEMP "node22-recovery"
          $releaseRoot = "C:\GameNightToolsRelease"
          $zipPath = Join-Path $releaseRoot "gamenight-tools-v0.3.6-NEXT-RECOVERY.zip"

          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          if (Test-Path $nodeRoot) { Remove-Item $nodeRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $work, $nodeRoot, $releaseRoot | Out-Null

          Write-Host "Downloading merged main branch..."
          git clone --depth 1 "https://github.com/$env:GITHUB_REPOSITORY.git" $work
          Set-Location $work

          Write-Host "Downloading Node.js 22..."
          $versions = Invoke-RestMethod "https://nodejs.org/dist/index.json"
          $nodeVersion = ($versions | Where-Object { $_.version -like "v22.*" } | Select-Object -First 1).version
          if (-not $nodeVersion) { throw "Could not determine the latest Node.js 22 version." }
          $nodeZip = Join-Path $env:RUNNER_TEMP "node22-recovery.zip"
          Invoke-WebRequest "https://nodejs.org/dist/$nodeVersion/node-$nodeVersion-win-x64.zip" -OutFile $nodeZip
          Expand-Archive $nodeZip -DestinationPath $nodeRoot -Force
          $nodeDir = Join-Path $nodeRoot "node-$nodeVersion-win-x64"
          $env:Path = "$nodeDir;$env:Path"

          node --version
          npm --version
          npm install
          npm run typecheck
          npm run build

          if (-not (Test-Path ".next\BUILD_ID")) {
            throw "Production build finished without .next\BUILD_ID."
          }

          $staging = Join-Path $work "recovery-package"
          $visibleBuild = Join-Path $staging "next-build"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item ".next" $visibleBuild -Recurse -Force

          @(
            (Join-Path $visibleBuild "cache"),
            (Join-Path $visibleBuild "types"),
            (Join-Path $visibleBuild "diagnostics")
          ) | ForEach-Object {
            if (Test-Path $_) { Remove-Item $_ -Recurse -Force }
          }

          $files = @(Get-ChildItem -LiteralPath $staging -File -Recurse -Force)
          if ($files.Count -lt 20) {
            throw "Recovery staging folder is unexpectedly small: only $($files.Count) files."
          }

          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zipStream = [System.IO.File]::Open($zipPath, [System.IO.FileMode]::CreateNew)
          $archive = New-Object System.IO.Compression.ZipArchive(
            $zipStream,
            [System.IO.Compression.ZipArchiveMode]::Create,
            $false
          )

          try {
            foreach ($file in $files) {
              $relative = $file.FullName.Substring($staging.Length).TrimStart([char[]]"\/").Replace("\", "/")
              $entry = $archive.CreateEntry($relative, [System.IO.Compression.CompressionLevel]::Optimal)
              $entryStream = $entry.Open()
              $sourceStream = $file.OpenRead()
              try {
                $sourceStream.CopyTo($entryStream)
              }
              finally {
                $sourceStream.Dispose()
                $entryStream.Dispose()
              }
            }
          }
          finally {
            $archive.Dispose()
            $zipStream.Dispose()
          }

          $readStream = [System.IO.File]::OpenRead($zipPath)
          $readArchive = New-Object System.IO.Compression.ZipArchive(
            $readStream,
            [System.IO.Compression.ZipArchiveMode]::Read,
            $false
          )
          try {
            $entries = @($readArchive.Entries | ForEach-Object { $_.FullName })
          }
          finally {
            $readArchive.Dispose()
            $readStream.Dispose()
          }

          if ($entries -notcontains "next-build/BUILD_ID") {
            throw "Recovery ZIP verification failed: next-build/BUILD_ID is missing."
          }
          if (@($entries | Where-Object { $_ -match "\\" }).Count -gt 0) {
            throw "Recovery ZIP contains unsafe backslash paths."
          }
          if ($entries.Count -lt 20) {
            throw "Recovery ZIP contains only $($entries.Count) files."
          }

          $zipSize = (Get-Item $zipPath).Length
          if ($zipSize -lt 100000) {
            throw "Recovery ZIP is unexpectedly small: $zipSize bytes."
          }

          Write-Host ""
          Write-Host "RECOVERY PACKAGE COMPLETE"
          Write-Host "Verified next-build/BUILD_ID"
          Write-Host "Recovery ZIP: $zipPath"
