name: Local release verification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    env:
      TARGET_REF: ${{ inputs.ref }}
    steps:
      - name: Type-check, build, and package selected ref
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          if ([string]::IsNullOrWhiteSpace($env:TARGET_REF)) { throw "A branch or tag is required." }
          if ($env:TARGET_REF -notmatch '^[A-Za-z0-9._/-]+$') { throw "The requested ref contains unsupported characters." }

          $safeRef = $env:TARGET_REF.Replace("/", "-")
          $work = Join-Path $env:RUNNER_TEMP "gamenight-tools-$safeRef"
          $nodeRoot = Join-Path $env:RUNNER_TEMP "node22-release"
          $releaseRoot = "C:\GameNightToolsRelease"

          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          if (Test-Path $nodeRoot) { Remove-Item $nodeRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $work, $nodeRoot, $releaseRoot | Out-Null

          Write-Host "Downloading $env:TARGET_REF..."
          git clone --depth 1 --branch "$env:TARGET_REF" "https://github.com/$env:GITHUB_REPOSITORY.git" $work
          Set-Location $work

          if (-not (Test-Path "VERSION")) { throw "VERSION file is missing from $env:TARGET_REF." }
          $version = (Get-Content "VERSION" -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION has an unexpected value: $version" }
          $zipPath = Join-Path $releaseRoot "gamenight-tools-v$version-directadmin.zip"
          $deploymentGuide = "DEPLOYMENT-v$version.md"

          Write-Host "Downloading Node.js 22..."
          $versions = Invoke-RestMethod "https://nodejs.org/dist/index.json"
          $nodeVersion = ($versions | Where-Object { $_.version -like "v22.*" } | Select-Object -First 1).version
          if (-not $nodeVersion) { throw "Could not determine the latest Node.js 22 version." }
          $nodeZip = Join-Path $env:RUNNER_TEMP "node22-release.zip"
          Invoke-WebRequest "https://nodejs.org/dist/$nodeVersion/node-$nodeVersion-win-x64.zip" -OutFile $nodeZip
          Expand-Archive $nodeZip -DestinationPath $nodeRoot -Force
          $nodeDir = Join-Path $nodeRoot "node-$nodeVersion-win-x64"
          $env:Path = "$nodeDir;$env:Path"

          node --version
          npm --version

          Write-Host "Installing dependencies..."
          npm install

          Write-Host "Running TypeScript check..."
          npm run typecheck

          Write-Host "Creating production build..."
          npm run build

          if (-not (Test-Path ".next\BUILD_ID")) { throw "Production build finished without .next\BUILD_ID." }

          Write-Host "Preparing DirectAdmin package..."
          $deploy = Join-Path $work "deploy"
          if (Test-Path $deploy) { Remove-Item $deploy -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $deploy | Out-Null

          Copy-Item "server.js" $deploy
          Copy-Item "package.json" $deploy
          Copy-Item "VERSION" $deploy
          if (Test-Path $deploymentGuide) { Copy-Item $deploymentGuide $deploy }
          Copy-Item ".next" (Join-Path $deploy ".next") -Recurse -Force
          if (Test-Path "public") { Copy-Item "public" (Join-Path $deploy "public") -Recurse -Force }

          @(
            (Join-Path $deploy ".next\cache"),
            (Join-Path $deploy ".next\types"),
            (Join-Path $deploy ".next\diagnostics")
          ) | ForEach-Object {
            if (Test-Path $_) { Remove-Item $_ -Recurse -Force }
          }

          $files = @(Get-ChildItem -LiteralPath $deploy -File -Recurse -Force)
          if ($files.Count -lt 20) { throw "Deployment package is unexpectedly small: $($files.Count) files." }

          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zipStream = [System.IO.File]::Open($zipPath, [System.IO.FileMode]::CreateNew)
          $archive = New-Object System.IO.Compression.ZipArchive($zipStream, [System.IO.Compression.ZipArchiveMode]::Create, $false)
          try {
            foreach ($file in $files) {
              $relative = $file.FullName.Substring($deploy.Length).TrimStart([char[]]"\/").Replace("\", "/")
              $entry = $archive.CreateEntry($relative, [System.IO.Compression.CompressionLevel]::Optimal)
              $entryStream = $entry.Open()
              $sourceStream = $file.OpenRead()
              try { $sourceStream.CopyTo($entryStream) }
              finally { $sourceStream.Dispose(); $entryStream.Dispose() }
            }
          }
          finally { $archive.Dispose(); $zipStream.Dispose() }

          $readStream = [System.IO.File]::OpenRead($zipPath)
          $readArchive = New-Object System.IO.Compression.ZipArchive($readStream, [System.IO.Compression.ZipArchiveMode]::Read, $false)
          try { $entries = @($readArchive.Entries | ForEach-Object { $_.FullName }) }
          finally { $readArchive.Dispose(); $readStream.Dispose() }

          foreach ($required in @(".next/BUILD_ID", "server.js", "package.json", "VERSION")) {
            if ($entries -notcontains $required) { throw "ZIP verification failed: missing $required" }
          }
          if (@($entries | Where-Object { $_ -match "\\" }).Count -gt 0) { throw "ZIP contains unsafe Windows backslash paths." }

          $zipSize = (Get-Item $zipPath).Length
          if ($zipSize -lt 100000) { throw "ZIP is unexpectedly small: $zipSize bytes." }

          Write-Host ""
          Write-Host "RELEASE VERIFICATION COMPLETE"
          Write-Host "Built ref: $env:TARGET_REF"
          Write-Host "Version: $version"
          Write-Host "Verified $($entries.Count) files and .next/BUILD_ID"
          Write-Host "DirectAdmin ZIP: $zipPath"
