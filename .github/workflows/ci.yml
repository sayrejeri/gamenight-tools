name: Local release build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Build Game Night Tools v0.3.6 on this PC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $work = Join-Path $env:RUNNER_TEMP "gamenight-tools-v0.3.6"
          $nodeRoot = Join-Path $env:RUNNER_TEMP "node22"
          $releaseRoot = "C:\GameNightToolsRelease"
          $zipPath = Join-Path $releaseRoot "gamenight-tools-v0.3.6-directadmin-FIXED.zip"

          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          if (Test-Path $nodeRoot) { Remove-Item $nodeRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $work, $nodeRoot, $releaseRoot | Out-Null

          Write-Host "Downloading the merged repository..."
          git clone --depth 1 "https://github.com/$env:GITHUB_REPOSITORY.git" $work
          Set-Location $work

          Write-Host "Downloading Node.js 22..."
          $versions = Invoke-RestMethod "https://nodejs.org/dist/index.json"
          $nodeVersion = ($versions | Where-Object { $_.version -like "v22.*" } | Select-Object -First 1).version
          if (-not $nodeVersion) { throw "Could not determine the latest Node.js 22 version." }
          $nodeZip = Join-Path $env:RUNNER_TEMP "node22.zip"
          Invoke-WebRequest "https://nodejs.org/dist/$nodeVersion/node-$nodeVersion-win-x64.zip" -OutFile $nodeZip
          Expand-Archive $nodeZip -DestinationPath $nodeRoot -Force
          $nodeDir = Join-Path $nodeRoot "node-$nodeVersion-win-x64"
          $env:Path = "$nodeDir;$env:Path"

          node --version
          npm --version

          Write-Host "Installing dependencies..."
          npm install

          Write-Host "Running TypeScript check..."
          npm run typecheck

          Write-Host "Creating production build..."
          npm run build

          Write-Host "Preparing DirectAdmin package..."
          $deploy = Join-Path $work "deploy"
          if (Test-Path $deploy) { Remove-Item $deploy -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $deploy | Out-Null

          Copy-Item "server.js" $deploy
          Copy-Item "package.json" $deploy
          Copy-Item "VERSION" $deploy
          Copy-Item "DEPLOYMENT-v0.3.6.md" $deploy
          Copy-Item ".next" (Join-Path $deploy ".next") -Recurse -Force
          if (Test-Path "public") { Copy-Item "public" (Join-Path $deploy "public") -Recurse -Force }

          @(
            (Join-Path $deploy ".next\cache"),
            (Join-Path $deploy ".next\types"),
            (Join-Path $deploy ".next\diagnostics")
          ) | ForEach-Object {
            if (Test-Path $_) { Remove-Item $_ -Recurse -Force }
          }

          $deployFiles = @(Get-ChildItem -LiteralPath $deploy -File -Recurse -Force)
          if ($deployFiles.Count -lt 20) {
            throw "Deployment staging folder is unexpectedly small: only $($deployFiles.Count) files."
          }

          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

          Write-Host "Creating a populated Linux-compatible ZIP..."
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zipStream = [System.IO.File]::Open($zipPath, [System.IO.FileMode]::CreateNew)
          $archive = New-Object System.IO.Compression.ZipArchive(
            $zipStream,
            [System.IO.Compression.ZipArchiveMode]::Create,
            $false
          )

          try {
            foreach ($file in $deployFiles) {
              $relative = $file.FullName.Substring($deploy.Length).TrimStart([char[]]"\/").Replace("\", "/")
              if ([string]::IsNullOrWhiteSpace($relative)) { continue }

              $entry = $archive.CreateEntry($relative, [System.IO.Compression.CompressionLevel]::Optimal)
              $entryStream = $entry.Open()
              $sourceStream = $file.OpenRead()
              try {
                $sourceStream.CopyTo($entryStream)
              }
              finally {
                $sourceStream.Dispose()
                $entryStream.Dispose()
              }
            }
          }
          finally {
            $archive.Dispose()
            $zipStream.Dispose()
          }

          Write-Host "Verifying ZIP contents and paths..."
          $readStream = [System.IO.File]::OpenRead($zipPath)
          $readArchive = New-Object System.IO.Compression.ZipArchive(
            $readStream,
            [System.IO.Compression.ZipArchiveMode]::Read,
            $false
          )

          try {
            $entries = @($readArchive.Entries | ForEach-Object { $_.FullName })
          }
          finally {
            $readArchive.Dispose()
            $readStream.Dispose()
          }

          if ($entries.Count -lt 20) {
            throw "ZIP verification failed: only $($entries.Count) files were stored."
          }

          $badEntries = @($entries | Where-Object { $_ -match "\\" })
          if ($badEntries.Count -gt 0) {
            throw "The ZIP contains Windows backslash paths and is unsafe for DirectAdmin."
          }

          foreach ($requiredEntry in @(".next/BUILD_ID", "server.js", "package.json", "VERSION")) {
            if ($entries -notcontains $requiredEntry) {
              throw "ZIP verification failed: missing $requiredEntry"
            }
          }

          $zipSize = (Get-Item $zipPath).Length
          if ($zipSize -lt 100000) {
            throw "ZIP verification failed: archive is only $zipSize bytes."
          }

          Write-Host ""
          Write-Host "BUILD COMPLETE"
          Write-Host "ZIP VERIFIED: $($entries.Count) files, $zipSize bytes"
          Write-Host "Your corrected DirectAdmin ZIP is here: $zipPath"
