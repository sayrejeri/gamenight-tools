name: Local release verification

on:
  workflow_dispatch:
    inputs:
      artifact_label:
        description: Optional artifact label override, e.g. v1.0.0-staging. Leave blank for final VERSION-based names.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    env:
      TARGET_REF: ${{ github.ref_name }}
      ARTIFACT_LABEL: ${{ inputs.artifact_label }}
    steps:
      - name: Type-check, build, and package selected ref
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          if ([string]::IsNullOrWhiteSpace($env:TARGET_REF)) { throw "A branch or tag is required." }
          if ($env:TARGET_REF -notmatch '^[A-Za-z0-9._/-]+$') { throw "The requested ref contains unsupported characters." }

          $safeRef = $env:TARGET_REF.Replace("/", "-")
          $work = Join-Path $env:RUNNER_TEMP "gamenight-tools-$safeRef"
          $nodeRoot = Join-Path $env:RUNNER_TEMP "node22-release"
          $releaseRoot = "C:\GameNightToolsRelease"

          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          if (Test-Path $nodeRoot) { Remove-Item $nodeRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $work, $nodeRoot, $releaseRoot | Out-Null

          Write-Host "Downloading $env:TARGET_REF..."
          git clone --depth 1 --branch "$env:TARGET_REF" "https://github.com/$env:GITHUB_REPOSITORY.git" $work
          Set-Location $work

          if (-not (Test-Path "VERSION")) { throw "VERSION file is missing from $env:TARGET_REF." }
          $version = (Get-Content "VERSION" -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION has an unexpected value: $version" }

          $artifactLabel = if ([string]::IsNullOrWhiteSpace($env:ARTIFACT_LABEL)) { "v$version" } else { $env:ARTIFACT_LABEL.Trim() }
          if ($artifactLabel -notmatch '^[A-Za-z0-9._-]+$') { throw "artifact_label contains unsupported characters." }
          $zipPath = Join-Path $releaseRoot "gamenight-tools-$artifactLabel-directadmin.zip"
          $workerZipPath = Join-Path $releaseRoot "gamenight-tools-bot-worker-$artifactLabel.zip"

          if (Test-Path $zipPath) { throw "Release artifact already exists and will not be overwritten: $zipPath. Use a different artifact_label or move the existing file first." }
          if ((Test-Path "bot-worker\index.mjs") -and (Test-Path $workerZipPath)) { throw "Worker artifact already exists and will not be overwritten: $workerZipPath. Use a different artifact_label or move the existing file first." }

          $deploymentGuide = "DEPLOYMENT-v$version.md"
          if ($artifactLabel -match '^v?(\d+\.\d+\.\d+)') {
            $candidateGuide = "DEPLOYMENT-v$($Matches[1]).md"
            if (Test-Path $candidateGuide) { $deploymentGuide = $candidateGuide }
          }

          Write-Host "Downloading Node.js 22..."
          $versions = Invoke-RestMethod "https://nodejs.org/dist/index.json"
          $nodeVersion = ($versions | Where-Object { $_.version -like "v22.*" } | Select-Object -First 1).version
          if (-not $nodeVersion) { throw "Could not determine the latest Node.js 22 version." }
          $nodeZip = Join-Path $env:RUNNER_TEMP "node22-release.zip"
          Invoke-WebRequest "https://nodejs.org/dist/$nodeVersion/node-$nodeVersion-win-x64.zip" -OutFile $nodeZip
          Expand-Archive $nodeZip -DestinationPath $nodeRoot -Force
          $nodeDir = Join-Path $nodeRoot "node-$nodeVersion-win-x64"
          $env:Path = "$nodeDir;$env:Path"

          node --version
          npm --version

          Write-Host "Installing dependencies..."
          npm install

          Write-Host "Auditing production dependencies..."
          npm audit --omit=dev --audit-level=high

          if (Test-Path "tests\v100-bot-schema-smoke.cjs") {
            Write-Host "Checking v1.0 bot migration schema..."
            node "tests\v100-bot-schema-smoke.cjs"
          }

          if (Test-Path "bot-worker\index.mjs") {
            Write-Host "Checking Four Seasons worker syntax..."
            if (Test-Path "bot-worker\index.js") { node --check "bot-worker\index.js" }
            node --check "bot-worker\index.mjs"
          }

          Write-Host "Running TypeScript check..."
          npm run typecheck

          Write-Host "Creating production build..."
          npm run build

          if (-not (Test-Path ".next\BUILD_ID")) { throw "Production build finished without .next\BUILD_ID." }

          function New-ReleaseZip {
            param(
              [Parameter(Mandatory=$true)][string]$SourceRoot,
              [Parameter(Mandatory=$true)][string]$Destination,
              [Parameter(Mandatory=$true)][string[]]$RequiredEntries,
              [int]$MinimumFiles = 1,
              [long]$MinimumBytes = 1
            )

            $files = @(Get-ChildItem -LiteralPath $SourceRoot -File -Recurse -Force)
            if ($files.Count -lt $MinimumFiles) { throw "Package is unexpectedly small: $($files.Count) files in $SourceRoot." }
            if (Test-Path $Destination) { throw "Refusing to overwrite existing release artifact: $Destination" }

            Add-Type -AssemblyName System.IO.Compression
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zipStream = [System.IO.File]::Open($Destination, [System.IO.FileMode]::CreateNew)
            $archive = New-Object System.IO.Compression.ZipArchive($zipStream, [System.IO.Compression.ZipArchiveMode]::Create, $false)
            try {
              foreach ($file in $files) {
                $relative = $file.FullName.Substring($SourceRoot.Length).TrimStart([char[]]"\/").Replace("\", "/")
                $entry = $archive.CreateEntry($relative, [System.IO.Compression.CompressionLevel]::Optimal)
                $entryStream = $entry.Open()
                $sourceStream = $file.OpenRead()
                try { $sourceStream.CopyTo($entryStream) }
                finally { $sourceStream.Dispose(); $entryStream.Dispose() }
              }
            }
            finally { $archive.Dispose(); $zipStream.Dispose() }

            $readStream = [System.IO.File]::OpenRead($Destination)
            $readArchive = New-Object System.IO.Compression.ZipArchive($readStream, [System.IO.Compression.ZipArchiveMode]::Read, $false)
            try { $entries = @($readArchive.Entries | ForEach-Object { $_.FullName }) }
            finally { $readArchive.Dispose(); $readStream.Dispose() }

            foreach ($required in $RequiredEntries) {
              if ($entries -notcontains $required) { throw "ZIP verification failed: missing $required in $Destination" }
            }
            if (@($entries | Where-Object { $_ -match "\\" }).Count -gt 0) { throw "ZIP contains unsafe Windows backslash paths: $Destination" }
            $zipSize = (Get-Item $Destination).Length
            if ($zipSize -lt $MinimumBytes) { throw "ZIP is unexpectedly small: $zipSize bytes in $Destination" }
            return @{ Entries = $entries; Size = $zipSize }
          }

          Write-Host "Preparing DirectAdmin package..."
          $deploy = Join-Path $work "deploy"
          if (Test-Path $deploy) { Remove-Item $deploy -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $deploy | Out-Null

          Copy-Item "server.js" $deploy
          Copy-Item "package.json" $deploy
          Copy-Item "VERSION" $deploy
          if (Test-Path $deploymentGuide) { Copy-Item $deploymentGuide $deploy }
          Copy-Item ".next" (Join-Path $deploy ".next") -Recurse -Force
          if (Test-Path "public") { Copy-Item "public" (Join-Path $deploy "public") -Recurse -Force }
          if (Test-Path "database") { Copy-Item "database" (Join-Path $deploy "database") -Recurse -Force }

          @(
            (Join-Path $deploy ".next\cache"),
            (Join-Path $deploy ".next\types"),
            (Join-Path $deploy ".next\diagnostics")
          ) | ForEach-Object {
            if (Test-Path $_) { Remove-Item $_ -Recurse -Force }
          }

          $websiteResult = New-ReleaseZip -SourceRoot $deploy -Destination $zipPath -RequiredEntries @(".next/BUILD_ID", "server.js", "package.json", "VERSION") -MinimumFiles 20 -MinimumBytes 100000
          if ((Test-Path "database\011_v100_discord_bot_beta.sql") -and $websiteResult.Entries -notcontains "database/011_v100_discord_bot_beta.sql") {
            throw "ZIP verification failed: v1.0 bot migration is missing."
          }

          $workerResult = $null
          if (Test-Path "bot-worker\index.mjs") {
            Write-Host "Preparing Four Seasons worker package..."
            $workerDeploy = Join-Path $work "bot-worker-deploy"
            if (Test-Path $workerDeploy) { Remove-Item $workerDeploy -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $workerDeploy | Out-Null
            if (Test-Path "bot-worker\index.js") { Copy-Item "bot-worker\index.js" $workerDeploy }
            Copy-Item "bot-worker\index.mjs" $workerDeploy
            Copy-Item "bot-worker\package.json" $workerDeploy
            if (Test-Path "bot-worker\.env.example") { Copy-Item "bot-worker\.env.example" $workerDeploy }
            if (Test-Path "docs\DISCORD_BOT_BETA.md") { Copy-Item "docs\DISCORD_BOT_BETA.md" $workerDeploy }
            $workerResult = New-ReleaseZip -SourceRoot $workerDeploy -Destination $workerZipPath -RequiredEntries @("index.js", "index.mjs", "package.json", ".env.example") -MinimumFiles 4 -MinimumBytes 1000
          }

          Write-Host ""
          Write-Host "RELEASE VERIFICATION COMPLETE"
          Write-Host "Built ref: $env:TARGET_REF"
          Write-Host "Source VERSION: $version"
          Write-Host "Artifact label: $artifactLabel"
          Write-Host "Verified $($websiteResult.Entries.Count) website files and .next/BUILD_ID"
          Write-Host "DirectAdmin ZIP: $zipPath"
          if ($workerResult) {
            Write-Host "Verified $($workerResult.Entries.Count) Four Seasons worker files"
            Write-Host "Four Seasons ZIP: $workerZipPath"
          }
