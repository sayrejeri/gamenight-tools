name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Prepare DirectAdmin deployment bundle
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp server.js deploy/server.js
          cp package.json deploy/package.json
          cp -a .next deploy/.next
          if [ -d public ]; then cp -a public deploy/public; fi

      - name: Upload DirectAdmin deployment bundle
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: gamenight-tools-directadmin
          path: deploy/
          include-hidden-files: true
          retention-days: 14
