name: Local release build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Build Game Night Tools v0.3.6 on this PC
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $work = Join-Path $env:RUNNER_TEMP "gamenight-tools-v0.3.6"
          $nodeRoot = Join-Path $env:RUNNER_TEMP "node22"
          $releaseRoot = "C:\GameNightToolsRelease"
          $zipPath = Join-Path $releaseRoot "gamenight-tools-v0.3.6-directadmin.zip"

          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          if (Test-Path $nodeRoot) { Remove-Item $nodeRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $work, $nodeRoot, $releaseRoot | Out-Null

          Write-Host "Downloading the merged repository..."
          git clone --depth 1 "https://github.com/$env:GITHUB_REPOSITORY.git" $work
          Set-Location $work

          Write-Host "Downloading Node.js 22..."
          $versions = Invoke-RestMethod "https://nodejs.org/dist/index.json"
          $nodeVersion = ($versions | Where-Object { $_.version -like "v22.*" } | Select-Object -First 1).version
          if (-not $nodeVersion) { throw "Could not determine the latest Node.js 22 version." }
          $nodeZip = Join-Path $env:RUNNER_TEMP "node22.zip"
          Invoke-WebRequest "https://nodejs.org/dist/$nodeVersion/node-$nodeVersion-win-x64.zip" -OutFile $nodeZip
          Expand-Archive $nodeZip -DestinationPath $nodeRoot -Force
          $nodeDir = Join-Path $nodeRoot "node-$nodeVersion-win-x64"
          $env:Path = "$nodeDir;$env:Path"

          node --version
          npm --version

          Write-Host "Installing dependencies..."
          npm install

          Write-Host "Running TypeScript check..."
          npm run typecheck

          Write-Host "Creating production build..."
          npm run build

          Write-Host "Preparing DirectAdmin package..."
          $deploy = Join-Path $work "deploy"
          if (Test-Path $deploy) { Remove-Item $deploy -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $deploy | Out-Null

          Copy-Item "server.js" $deploy
          Copy-Item "package.json" $deploy
          Copy-Item "VERSION" $deploy
          Copy-Item "DEPLOYMENT-v0.3.6.md" $deploy
          Copy-Item ".next" (Join-Path $deploy ".next") -Recurse -Force
          if (Test-Path "public") { Copy-Item "public" (Join-Path $deploy "public") -Recurse -Force }

          @(
            (Join-Path $deploy ".next\cache"),
            (Join-Path $deploy ".next\types"),
            (Join-Path $deploy ".next\diagnostics")
          ) | ForEach-Object {
            if (Test-Path $_) { Remove-Item $_ -Recurse -Force }
          }

          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $deploy "*") -DestinationPath $zipPath -CompressionLevel Optimal

          Write-Host ""
          Write-Host "BUILD COMPLETE"
          Write-Host "Your DirectAdmin ZIP is here: $zipPath"
