name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository without a reusable action
        shell: bash
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Type-check and build with Node.js 22
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          . "$NVM_DIR/nvm.sh"
          nvm install 22
          nvm use 22
          node --version
          npm --version
          npm install
          npm run typecheck
          npm run build

      - name: Prepare DirectAdmin deployment ZIP
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp server.js deploy/server.js
          cp package.json deploy/package.json
          cp VERSION deploy/VERSION
          cp DEPLOYMENT-v0.3.6.md deploy/DEPLOYMENT-v0.3.6.md
          cp -a .next deploy/.next
          rm -rf deploy/.next/cache deploy/.next/types deploy/.next/diagnostics
          if [ -d public ]; then cp -a public deploy/public; fi
          ZIP_NAME="gamenight-tools-v0.3.6-directadmin.zip"
          (cd deploy && zip -qr "../${ZIP_NAME}" .)
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Publish DirectAdmin ZIP as a GitHub release asset
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          TAG="v$(cat VERSION)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_NAME" --clobber
          else
            gh release create "$TAG" "$ZIP_NAME" \
              --target "$GITHUB_SHA" \
              --title "Game Night Tools $TAG" \
              --notes-file DEPLOYMENT-v0.3.6.md
          fi
